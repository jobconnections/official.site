<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOB CONNECTIONS Content Manager</title>
    <style>
      /* ==========================================================
         日本語連動項目：黄色インフォアイコン ＆ 吹き出しツールチップ
         ========================================================== */

      /* 対象項目のヘッダー設定 */
      :is(
        [data-key-path="jobCategory"],
        [data-key-path="employmentType"],
        [data-key-path="status"],
        [data-key-path="prefecture"],
        [data-key-path="salaryType"],
        [data-key-path="salaryAmount"],
        [data-key-path="salaryUpperLimit"],
        [data-key-path="japaneseSpeaking"],
        [data-key-path="japaneseReading"],
        [data-key-path="japaneseWriting"],
        [data-key-path="japaneseJlpt"],
        [data-key-path="requiredInfo"],
        [data-key-path="requirePhone"],
        [data-key-path="applicationPhone"],
        [data-key-path="datePosted"],
        [data-key-path="validThrough"]
      ) > header {
        position: relative !important;
        overflow: visible !important;
      }

      :is(
        [data-key-path="jobCategory"],
        [data-key-path="employmentType"],
        [data-key-path="status"],
        [data-key-path="prefecture"],
        [data-key-path="salaryType"],
        [data-key-path="salaryAmount"],
        [data-key-path="salaryUpperLimit"],
        [data-key-path="japaneseSpeaking"],
        [data-key-path="japaneseReading"],
        [data-key-path="japaneseWriting"],
        [data-key-path="japaneseJlpt"],
        [data-key-path="requiredInfo"],
        [data-key-path="requirePhone"],
        [data-key-path="applicationPhone"],
        [data-key-path="datePosted"],
        [data-key-path="validThrough"]
      ) > header h4 {
        display: inline-flex !important;
        align-items: center !important;
        position: relative !important;
        overflow: visible !important;
        cursor: help !important;
      }

      /* 1. 黄色のインフォアイコン (::after) */
      :is(
        [data-key-path="jobCategory"],
        [data-key-path="employmentType"],
        [data-key-path="status"],
        [data-key-path="prefecture"],
        [data-key-path="salaryType"],
        [data-key-path="salaryAmount"],
        [data-key-path="salaryUpperLimit"],
        [data-key-path="japaneseSpeaking"],
        [data-key-path="japaneseReading"],
        [data-key-path="japaneseWriting"],
        [data-key-path="japaneseJlpt"],
        [data-key-path="requiredInfo"],
        [data-key-path="requirePhone"],
        [data-key-path="applicationPhone"],
        [data-key-path="datePosted"],
        [data-key-path="validThrough"]
      ) > header h4::after {
        content: "ℹ";
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 17px;
        height: 17px;
        margin-left: 8px;
        border-radius: 50%;
        font-size: 11px;
        font-weight: 800;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1;
        /* 黄色・ゴールドの配色 */
        color: #b45309;
        background: #fef3c7;
        border: 1.5px solid #f59e0b;
        box-shadow: 0 1px 3px rgba(245, 158, 11, 0.25);
        vertical-align: middle;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: auto;
      }

      /* アイコンホバー時の強調効果 */
      :is(
        [data-key-path="jobCategory"],
        [data-key-path="employmentType"],
        [data-key-path="status"],
        [data-key-path="prefecture"],
        [data-key-path="salaryType"],
        [data-key-path="salaryAmount"],
        [data-key-path="salaryUpperLimit"],
        [data-key-path="japaneseSpeaking"],
        [data-key-path="japaneseReading"],
        [data-key-path="japaneseWriting"],
        [data-key-path="japaneseJlpt"],
        [data-key-path="requiredInfo"],
        [data-key-path="requirePhone"],
        [data-key-path="applicationPhone"],
        [data-key-path="datePosted"],
        [data-key-path="validThrough"]
      ) > header h4:hover::after {
        background: #fde68a;
        border-color: #d97706;
        color: #78350f;
        transform: scale(1.15);
        box-shadow: 0 2px 6px rgba(217, 119, 6, 0.4);
      }

      /* 2. 吹き出し（ツールチップ）本体 (::before) */
      :is(
        [data-key-path="jobCategory"],
        [data-key-path="employmentType"],
        [data-key-path="status"],
        [data-key-path="prefecture"],
        [data-key-path="salaryType"],
        [data-key-path="salaryAmount"],
        [data-key-path="salaryUpperLimit"],
        [data-key-path="japaneseSpeaking"],
        [data-key-path="japaneseReading"],
        [data-key-path="japaneseWriting"],
        [data-key-path="japaneseJlpt"],
        [data-key-path="requiredInfo"],
        [data-key-path="requirePhone"],
        [data-key-path="applicationPhone"],
        [data-key-path="datePosted"],
        [data-key-path="validThrough"]
      ) > header h4::before {
        content: "🇯🇵 日本語連動：日本語（ja）で設定した内容が全言語に自動反映されます";
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        transform: translateY(4px);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
        white-space: nowrap;
        color: #ffffff;
        background: #0f172a;
        border: 1px solid #f59e0b;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
        z-index: 99999;
      }

      /* ホバー時に吹き出しを表示 */
      :is(
        [data-key-path="jobCategory"],
        [data-key-path="employmentType"],
        [data-key-path="status"],
        [data-key-path="prefecture"],
        [data-key-path="salaryType"],
        [data-key-path="salaryAmount"],
        [data-key-path="salaryUpperLimit"],
        [data-key-path="japaneseSpeaking"],
        [data-key-path="japaneseReading"],
        [data-key-path="japaneseWriting"],
        [data-key-path="japaneseJlpt"],
        [data-key-path="requiredInfo"],
        [data-key-path="requirePhone"],
        [data-key-path="applicationPhone"],
        [data-key-path="datePosted"],
        [data-key-path="validThrough"]
      ) > header h4:hover::before {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      /* 個別項目の吹き出しテキスト最適化 */
      [data-key-path="applicationPhone"] > header h4::before {
        content: "🇯🇵 日本語連動：数字とハイフンのみ。日本語（ja）の設定が全言語に自動反映されます";
      }
      [data-key-path="status"] > header h4::before {
        content: "🇯🇵 日本語連動：公開・下書き状態は全言語共通で連動します";
      }
      [data-key-path="japaneseSpeaking"] > header h4::before,
      [data-key-path="japaneseReading"] > header h4::before,
      [data-key-path="japaneseWriting"] > header h4::before,
      [data-key-path="japaneseJlpt"] > header h4::before {
        content: "🇯🇵 日本語連動：日本語（ja）で選択した能力要件が全言語に自動反映されます";
      }

      /* ダークテーマ時の微調整 */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) :is(
          [data-key-path="jobCategory"],
          [data-key-path="employmentType"],
          [data-key-path="status"],
          [data-key-path="prefecture"],
          [data-key-path="salaryType"],
          [data-key-path="salaryAmount"],
          [data-key-path="salaryUpperLimit"],
          [data-key-path="japaneseSpeaking"],
          [data-key-path="japaneseReading"],
          [data-key-path="japaneseWriting"],
          [data-key-path="japaneseJlpt"],
          [data-key-path="requiredInfo"],
          [data-key-path="requirePhone"],
          [data-key-path="applicationPhone"],
          [data-key-path="datePosted"],
          [data-key-path="validThrough"]
        ) > header h4::after {
          background: rgba(245, 158, 11, 0.2);
          border-color: #f59e0b;
          color: #fbbf24;
        }

        :root:not([data-theme="light"]) :is(
          [data-key-path="jobCategory"],
          [data-key-path="employmentType"],
          [data-key-path="status"],
          [data-key-path="prefecture"],
          [data-key-path="salaryType"],
          [data-key-path="salaryAmount"],
          [data-key-path="salaryUpperLimit"],
          [data-key-path="japaneseSpeaking"],
          [data-key-path="japaneseReading"],
          [data-key-path="japaneseWriting"],
          [data-key-path="japaneseJlpt"],
          [data-key-path="requiredInfo"],
          [data-key-path="requirePhone"],
          [data-key-path="applicationPhone"],
          [data-key-path="datePosted"],
          [data-key-path="validThrough"]
        ) > header h4:hover::after {
          background: rgba(245, 158, 11, 0.35);
          color: #fde68a;
        }
      }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS の読み込み -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
