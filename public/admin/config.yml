backend:
  name: github
  # TODO: 本番運用時にはクライアントの実際のリポジトリに変更してください
  repo: jobconnections/official.site
  branch: main
  
media_folder: "public/assets/img"
public_folder: "/assets/img"

# Sveltia CMS 特有の画像最適化機能（WebP自動変換設定）
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85

# 多言語対応設定
i18n:
  structure: multiple_folders
  locales: [ja, en, pt-br]
  default_locale: ja

collections:
  - name: "jobs"
    label: "求人情報"
    folder: "src/content/jobs"
    create: true
    i18n: true
    slug: "JOB{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    fields:
      - {label: "タイトル", name: "title", widget: "string", i18n: true}
      - {label: "ステータス", name: "status", widget: "select", options: ["draft", "published", "closed"], default: "draft", i18n: duplicate}
      - {label: "雇用形態", name: "employmentType", widget: "select", options: ["正社員", "契約社員", "アルバイト", "業務委託"], i18n: duplicate}
      - label: "勤務地"
        name: "location"
        widget: "object"
        i18n: duplicate
        fields:
          - {label: "都道府県", name: "prefecture", widget: "string"}
          - {label: "市区町村", name: "city", widget: "string"}
      - label: "給与"
        name: "salary"
        widget: "object"
        i18n: duplicate
        fields:
          - {label: "給与種別", name: "type", widget: "select", options: ["時給", "日給", "月給"]}
          - {label: "下限", name: "min", widget: "number", value_type: "int"}
          - {label: "上限", name: "max", widget: "number", value_type: "int", required: false}
      - {label: "日本語能力", name: "japaneseLevel", widget: "select", options: ["不問", "N4以上", "N3以上", "N2以上", "N1以上"], default: "不問", i18n: duplicate}
      - {label: "メイン画像", name: "image", widget: "image", required: false, i18n: duplicate}
      - {label: "掲載日", name: "datePosted", widget: "datetime", format: "YYYY-MM-DD", time_format: false, type: "date", i18n: duplicate}
      - {label: "掲載終了日", name: "validThrough", widget: "datetime", format: "YYYY-MM-DD", time_format: false, type: "date", required: false, i18n: duplicate}
      - {label: "本文", name: "body", widget: "markdown", i18n: true}
